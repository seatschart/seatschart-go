    get:
      description: "Breakdown of `usedObjects` (see GET /usage) by chart, each with\
        \ its events (most used first). Events are grouped under their current chart;\
        \ deleted events or events without a chart are listed under `chartId: null`.\
        \ Read from the metering table (no counters on the booking path). Dashboard\
        \ JWT (any role) or an API key."
