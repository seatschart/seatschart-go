  /api/workspace/chart-validation:
    get:
      description: "Level of every chart validation rule for this workspace (`off`,\
        \ `warning` or `error`) plus the product defaults. The designer, `POST /charts/{chartId}/map/publish`,\
        \ `POST /charts/{chartId}/actions/validate` and event creation all apply these\
        \ levels. Rules: `no_objects` (no seats or GA areas), `empty_label` (unlabeled\
        \ seats / GA areas), `duplicate_label` (same label in a section), `uncategorized`\
        \ (objects without a category once categories exist), `overlap`, `table_too_small`\
        \ (< 2 seats), `ga_invalid_capacity` (GA capacity missing or outside 1–100000),\
        \ `empty_floor` (multi-floor maps), `empty_section`, `outside_section` (seat\
        \ outside its section outline), `multiple_object_types` (one category used\
        \ by seats, table seats and GA areas), `missing_focal_point`, `zone_missing_focal_point`,\
        \ `orphan_gap` (one-seat gap in a row), `ga_table_capacity` (GA tables in\
        \ an area hold more places than its capacity)."
      operationId: getApiWorkspaceChart-validation
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get chart validation severities
      tags:
      - workspace
    patch:
      description: "Workspace admins only. Merges `severities` into the stored levels\
        \ (only differences from the defaults are kept); `reset: true` restores the\
        \ defaults first. Takes effect immediately in the designer and the API (other\
        \ API replicas within 5 seconds). Charts are not re-validated: stored per-rule\
        \ counts are re-read under the new levels. Every change is written to the\
        \ audit log (`workspace.chart_validation.update`). Rules: `no_objects` (no\
        \ seats or GA areas), `empty_label` (unlabeled seats / GA areas), `duplicate_label`\
        \ (same label in a section), `uncategorized` (objects without a category once\
        \ categories exist), `overlap`, `table_too_small` (< 2 seats), `ga_invalid_capacity`\
        \ (GA capacity missing or outside 1–100000), `empty_floor` (multi-floor maps),\
        \ `empty_section`, `outside_section` (seat outside its section outline), `multiple_object_types`\
        \ (one category used by seats, table seats and GA areas), `missing_focal_point`,\
        \ `zone_missing_focal_point`, `orphan_gap` (one-seat gap in a row), `ga_table_capacity`\
        \ (GA tables in an area hold more places than its capacity)."
      operationId: patchApiWorkspaceChart-validation
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
