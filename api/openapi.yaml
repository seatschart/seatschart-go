  /api/charts:
    get:
      description: "Without query parameters, returns the legacy `{ charts }` shape\
        \ (newest draft first, at most 200 rows, archived charts hidden); its items\
        \ carry `publishedValidation` (stored counts of the published map, what event\
        \ creation checks). When `limit`, `cursor`, `q`, `archived`, `tag`, `sort`\
        \ or `expand` is sent, returns a cursor page `{ items, nextCursor }` (stable\
        \ across pages, no row cap). Pass `nextCursor` back as `cursor` with the same\
        \ filters until it is null. Paginated items add `eventCount`, `recentEvents`\
        \ (up to 3 `{ id, name, date, status: upcoming | past | ended }`: upcoming\
        \ soonest first, then past most recent first, then ended), `archivedAt`, `createdAt`,\
        \ `tags`, `latestVersion`, `hasThumbnail` and `thumbnailUrl` (authenticated\
        \ relative path, null until first publish) and omit `mapTemplate` (no layout\
        \ geometry is read). `validation` `{ errors, warnings, issues: [{ code, severity,\
        \ count, message }] }` holds the per-rule counts stored at the last draft\
        \ save / publish under the current workspace severity (null when never computed);\
        \ the rules are not re-run. Archived charts are hidden unless `archived=true|all`."
      operationId: getApiCharts
      parameters:
      - description: "Page size (1..100, default 20)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          description: "Page size (1..100, default 20)."
          maximum: 100
          minimum: 1
          type: number
        style: form
      - description: Opaque `nextCursor` value from the previous page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          maxLength: 512
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
          type: string
        style: form
      - description: "Case-insensitive substring match on the chart name, or the exact\
          \ chart key."
        explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 128
          minLength: 1
          type: string
        style: form
      - description: "`false` (default) hides archived charts, `true` returns only\
          \ archived charts, `all` returns both."
        explode: true
        in: query
        name: archived
        required: false
        schema:
          enum:
          - "false"
          - "true"
          - all
          type: string
        style: form
      - description: "Comma-separated tags (case-insensitive, at most 5); a chart\
          \ must carry all of them."
        explode: true
        in: query
        name: tag
        required: false
        schema:
          maxLength: 256
          minLength: 1
          type: string
        style: form
      - description: "`name` (default): name A→Z. `recent`: last draft save / publish\
          \ first, then creation time."
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - name
          - recent
          type: string
        style: form
      - description: "Comma-separated. `events` adds `events[]` (`{ id, key, name,\
          \ date, isInThePast }`, soonest first, at most 100 per chart; `eventCount`\
          \ has the total). `validation` is accepted for seats.io compatibility (`validation`\
          \ is always part of paginated items)."
        explode: true
        in: query
        name: expand
        required: false
        schema:
          maxLength: 64
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List charts
      tags:
      - charts
    post:
      description: "Creates a reusable seating chart. Optional in the same call: `key`\
        \ (partner key, unique per workspace, usable wherever a chart id is accepted;\
        \ 409 `chart_key_taken`), `venueType` (`simple` | `sections` | `zones`, the\
        \ designer template) and `categories` (up to 128 `{ key?, label, color, accessible?\
        \ }`; keys and labels unique, case-insensitive). With `venueType` or `categories`\
        \ an initial draft holding them is written in the same transaction (`hasDraft:\
        \ true`). Author geometry via `PUT /api/charts/:chartId/map/draft` and publish\
        \ before attaching to events."
      operationId: postApiCharts
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiCharts_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiCharts_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiCharts_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
