  /api/webhooks/{id}/deliveries:
    get:
      description: "Newest first, cursor-paginated (`nextCursor`). Combines the durable\
        \ SQL outbox (`reservations.confirmed`, retried with exponential backoff)\
        \ with fire-and-forget dispatches (`holds.*`, `ga.*`, `objects.updated`, …\
        ), test events and replays. Entries expose event id, type, status, attempts,\
        \ HTTP status and a stable error code only — never response bodies, URLs or\
        \ credentials. Direct-send entries are retained for `WEBHOOK_DELIVERY_RETENTION_DAYS`\
        \ (default 30)."
      operationId: getApiWebhooksByIdDeliveries
      parameters:
      - description: Webhook UUID (stored lowercase)
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Page size (1..100, default 20)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          description: "Page size (1..100, default 20)."
          maximum: 100
          minimum: 1
          type: number
        style: form
      - description: Opaque `nextCursor` value from the previous page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          maxLength: 512
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
          type: string
        style: form
      - description: '`pending` also matches deliveries currently being attempted
          (`processing`).'
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - delivered
          - failed
          - pending
          type: string
        style: form
      - explode: true
        in: query
        name: eventType
        required: false
        schema:
          maxLength: 64
          minLength: 1
          pattern: "^[a-z.]+$"
          type: string
        style: form
      - explode: true
        in: query
        name: source
        required: false
        schema:
          enum:
          - outbox
          - dispatch
          - test
          - replay
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List deliveries of a webhook endpoint
      tags:
      - webhooks
  /api/webhooks/{id}/deliveries/{deliveryId}:
