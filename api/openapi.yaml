  /api/events/{eventId}/inventory/for-sale/apply:
    post:
      description: "Batch-set `for_sale` on seats and/or GA areas (`seatIds`, `gaAreaIds`,\
        \ and/or whole `categories`). When marking not-for-sale, releases active Redis\
        \ seat holds and clears GA hold hashes for those objects. `areaPlaces` (`{\
        \ gaAreaId: places }`) withholds (`forSale: false`) or returns (`forSale:\
        \ true`) a number of places of a GA area without closing it: withholding is\
        \ checked under the GA row lock against sold and held places (409 `insufficient_free_places`),\
        \ and new holds then use capacity minus withheld places. `everything: true`\
        \ (alone) puts every seat (except retired ones) and GA area back on sale and\
        \ clears withheld places. Category toggles never put retired seats back on\
        \ sale. Invalidates the seat-map cache and publishes inventory SSE (`kind:\
        \ inventory`, `type: for_sale`) so connected viewers can apply NFS locally.\
        \ Optional `cascadeSeason` (default false) syncs live season siblings when\
        \ this event is the source (NFS + channels + object_statuses; past members\
        \ skipped; members with `forSalePropagated: false` keep their own for-sale\
        \ flags). Inheritance is cascade-on-write, not a second table. On a season\
        \ member that is not the source, this call sets the membership's `forSalePropagated`\
        \ to false (response `forSalePropagated: false` when it changed): restore\
        \ it with PATCH /seasons/{seasonId}/events/{eventId}. Response includes `notForSalePlaces`\
        \ (resulting withheld places per GA area touched). Requires partner API key\
        \ or dashboard JWT with map authoring permission."
      operationId: postApiEventsByEventIdInventoryFor-saleApply
      parameters:
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
        style: simple
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdInventoryFor_saleApply_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdInventoryFor_saleApply_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdInventoryFor_saleApply_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Apply for-sale / not-for-sale to a selection (incremental)
      tags:
      - events
  /api/events/{eventId}/inventory/for-sale:
    put:
      description: "Seats.io `replaceForSaleConfig` in **one SQL transaction** (all\
        \ or nothing): the listed seats (`seatIds`), GA areas (`gaAreaIds`, or keys\
        \ of `areaPlaces`) and every object of the listed `categories` take `forSale`,\
        \ every other seat and GA area of the event takes the opposite. `areaPlaces`\
        \ sets the withheld places of a listed area (`forSale: false`: that many places\
        \ off sale; `forSale: true`: only that many on sale); unlisted areas keep\
        \ no withheld places. Retired seats always stay off sale. GA rows are locked\
        \ and withheld places are checked against sold and held places (409 `insufficient_free_places`,\
        \ nothing written). Holds on objects that went off sale are released after\
        \ COMMIT; one cache invalidate and one `for_sale` realtime message per direction.\
        \ Empty lists with `forSale: false` put everything on sale. Response: `changedSeats`,\
