  /api/orders/{orderId}/cancel:
    post:
      description: "Requires `Idempotency-Key`. Partner API key with the `bookings`\
        \ scope, or a dashboard session of a workspace admin / map editor; `reason`\
        \ is stored on the cancelled reservations and receipts. Cancels every seat\
        \ of the order (seats become free, or retired when not for sale) and, for\
        \ **administrative bookings**, every general-admission receipt: its remaining\
        \ places (quantity minus administrative releases) are returned to the area\
        \ under the GA row lock in the same transaction (`gaAreas: [{ eventId, areaId,\
        \ returnedPlaces }]`). Receipts stay as history with `cancelledAt`. Retrying\
        \ a cancelled order returns it unchanged. Orders with non-administrative GA\
        \ receipts, legacy or failed orders fail closed (409 `inventory_conflict`).\
        \ Payment refunds are the integrator's responsibility."
      operationId: postApiOrdersByOrderIdCancel
      parameters:
      - explode: false
        in: path
        name: orderId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
