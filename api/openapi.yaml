      parameters:
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
        style: simple
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdActionsChange_object_status_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdActionsChange_object_status_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdActionsChange_object_status_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Create a durable administrative booking on unheld inventory (or on
        a hold token)
      tags:
      - object-status
