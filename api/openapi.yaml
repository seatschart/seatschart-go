  /api/usage:
    get:
      description: "Test (sandbox) workspaces (`isTest: true`) are never metered and\
        \ have no limits (`limit: null`). `usedObjects.count` is the number of distinct\
        \ objects booked in the UTC calendar month (seats.io-style billing unit):\
        \ every seat that became booked counts once per month however often it is\
        \ retried, released and re-booked; each sold general-admission place counts\
        \ as one. Holds, test events and replays never count. `history` has exactly\
        \ 12 months ending at `month` (zero-filled); `byEvent` lists the top 100 events\
        \ of the month. `charts`/`events` are current totals against the plan limits.\
        \ Dashboard JWT (any role) or an API key with the `reports` scope."
