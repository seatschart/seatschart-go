        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Indexed visual projection stream
      tags:
      - sse
  /api/webhooks:
    get:
      description: "Returns all outbound webhook endpoints of the authenticated tenant\
        \ with their event-type subscription (`eventTypes`, `[\"*\"]` = all) and the\
        \ outcome of the most recent delivery (`lastDelivery`). Requires the `webhooks`\
        \ scope for scoped API keys."
      operationId: getApiWebhooks
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List webhooks for the authenticated tenant
      tags:
      - webhooks
    post:
      description: "Registers an HTTPS callback URL (except `http://localhost` / `127.0.0.1`\
        \ only for local development). Duplicate URLs per tenant are rejected with\
        \ `409 Conflict`. `eventTypes` defaults to `[\"*\"]` (every type); unknown\
        \ types are rejected with `400`. The response includes `signingSecret` exactly\
        \ once: deliveries to this endpoint carry `x-seatschart-signature: sha256=<hex\
        \ HMAC-SHA256 of the raw body>` keyed with it, plus `x-seatschart-timestamp`\
        \ and `x-seatschart-signature-v2: t=<unix seconds>,v1=<hex HMAC-SHA256 of\
        \ \"t.rawBody\">` (recommended: verify v1 in constant time and reject timestamps\
        \ more than 5 minutes old), `X-SeatsChart-Event` and `X-SeatsChart-Event-Id`.\
        \ In production the host is DNS-resolved at registration and refused when\
        \ any record is loopback, private, link-local, CGNAT or metadata; every send\
        \ re-resolves and pins a public address and never follows redirects."
      operationId: postApiWebhooks
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiWebhooks_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiWebhooks_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiWebhooks_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Create a webhook endpoint
      tags:
      - webhooks
  /api/webhooks/event-types:
    get:
      description: "Event types an endpoint can subscribe to through `eventTypes`.\
        \ `webhook.test` is sent only by `POST /api/webhooks/{id}/test` and cannot\
        \ be subscribed to."
      operationId: getApiWebhooksEvent-types
