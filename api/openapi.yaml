openapi: 3.0.3
info:
  description: "Seat inventory and locking API for B2B2C integrations. Authenticate\
    \ using `x-api-key` (partners) or `Authorization: Bearer` with an HS256 JWT."
  title: SeatsChart API
  version: 1.0.0
servers:
- url: /
tags:
- description: Stripe subscription and plan limits
  name: billing
- description: "Monthly used objects (distinct objects booked per UTC month), chart/event\
    \ counts and plan allowances. Rate limits are per tenant and plan, with a reserved\
    \ sales lane: see `X-RateLimit-Tenant-Policy` and `Retry-After` on `429`."
  name: usage
- description: "Events, their inventory and reports. Every `{eventId}` path parameter\
    \ (and body `eventId` / `eventIds` / `events`) also accepts the event `key` (unique\
    \ per workspace); UUIDs are never looked up."
  name: events
- description: "Reusable seating charts: drafts, validation, categories, publish history,\
    \ copies and tags."
  name: charts
- description: "Administrative object status changes (seats and general-admission\
    \ quantities): book, hold, release, retire, resale, custom statuses and extra\
    \ data."
  name: object-status
- description: "Workspace profile, membership list and activation (dashboard sessions)."
  name: workspace
- description: Durable orders and whole-order cancellation.
  name: orders
- description: "Unauthenticated, CDN-cacheable reads keyed by the workspace public\
    \ key (`/api/public/{publicKey}/…`). Default public cohort only: no channel inventory,\
    \ holder identities or ops fields."
  name: public
- description: Server-Sent Events for live seat updates
  name: sse
- description: Reservation and Lua locks
  name: seats
- description: "Partner webhook endpoints: per-endpoint HMAC secrets (rotation), event-type\
    \ subscriptions, a delivery log covering the durable outbox and direct sends,\
    \ replay with the current secret and signed test events."
  name: webhooks
- description: "Tenant-scoped secret API keys (`sk_live_…`, SHA-256 at rest) with\
    \ scopes (read, holds, bookings, inventory_admin, charts_write, events_write,\
    \ reports, webhooks); dashboard JWT lifecycle only. Missing scope → 403 `insufficient_scope`."
  name: api-keys
- description: "Dashboard signup, login, and session profile (email/password accounts)."
  name: auth
- description: Workspace configuration change history (admin JWT only).
  name: audit
paths:
  /health/live:
    get:
      operationId: getHealthLive
      responses:
        "200":
          description: HTTP 200
  /internal/metrics:
    get:
      operationId: getInternalMetrics
      responses:
        "200":
          description: HTTP 200
  /assets/map/{tenantId}/{eventId}/{filename}:
    get:
      description: Serves map images from local disk or proxies from R2. Production
        requires HMAC `exp`/`sig` unless MAP_ASSET_REQUIRE_SIGNED=0.
      operationId: getAssetsMapByTenantIdByEventIdByFilename
      parameters:
      - explode: false
        in: path
        name: tenantId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: filename
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      summary: Serve persisted map reference/background images
      tags:
      - assets
  /api/billing/webhook:
    post:
      description: Receives Stripe subscription lifecycle events. Requires STRIPE_WEBHOOK_SECRET
        and raw body signature verification.
      operationId: postApiBillingWebhook
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      summary: Stripe webhook
      tags:
      - billing
  /api/events/{eventId}/embed-policy:
    get:
      description: "Public read used by the Next.js viewer to build CSP frame-ancestors\
        \ and validate parent_origin. Also returns `publicKey` (`pub_…`) so `?workspaceKey=`\
        \ can be allowlisted. Also returns `event` (`name`, `startsAt` ISO-8601 or\
        \ null when the date was never set) for the buyer page header. Returns origins,\
        \ public key and the event name/date only (no tenant id). Does not require\
        \ authentication."
      operationId: getApiEventsByEventIdEmbed-policy
      parameters:
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      summary: Resolve tenant embed origins for an event
      tags:
      - embed-origins
  /api/public/{publicKey}/events/{eventId}/manifest:
    get:
      description: "Published geometry pointer for the event. `geometryUrl` points\
        \ at the public geometry path. ETag = mapRevision + currency. Includes the\
        \ event catalog `currency` (ISO 4217, null for legacy events). `Cache-Control:\
        \ public, max-age=5, stale-while-revalidate=30` (PUBLIC_MANIFEST_* env). A\
        \ stale manifest is safe: the state carries mapRevision and clients switch\
        \ geometry when it differs. Unknown key or event: 404 no-store. `eventId`\
        \ also accepts the event key. A deactivated workspace returns 403 `workspace_deactivated`\
        \ (no-store). CDN cache key: path + Origin + normalized Accept-Encoding. Never\
        \ forward or key on cookies, Authorization, x-api-key, x-channel-key or the\
        \ query string."
      operationId: getApiPublicByPublicKeyEventsByEventIdManifest
      parameters:
      - description: Workspace public key (`pub_…`).
        explode: false
        in: path
        name: publicKey
        required: true
        schema:
          maxLength: 64
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      security: []
      summary: Public geometry manifest (CDN-cacheable)
      tags:
      - public
  /api/public/{publicKey}/events/{eventId}/geometry/{hash}:
    get:
      description: "Content-addressed geometry (sha256 of the canonical JSON). br/gzip\
        \ negotiated from Accept-Encoding. `Cache-Control: public, max-age=31536000,\
        \ immutable`. Clients must verify the hash. Unknown key, event or hash: 404\
        \ no-store. `eventId` also accepts the event key. A deactivated workspace\
        \ returns 403 `workspace_deactivated` (no-store). CDN cache key: path + Origin\
        \ + normalized Accept-Encoding. Never forward or key on cookies, Authorization,\
        \ x-api-key, x-channel-key or the query string."
      operationId: getApiPublicByPublicKeyEventsByEventIdGeometryByHash
      parameters:
      - description: Workspace public key (`pub_…`).
        explode: false
        in: path
        name: publicKey
        required: true
        schema:
          maxLength: 64
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: hash
        required: true
        schema:
          pattern: "^[a-f0-9]{64}$"
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      security: []
      summary: Public immutable geometry (CDN-cacheable)
      tags:
      - public
  /api/public/{publicKey}/events/{eventId}/state:
    get:
      description: "Compact availability of the default public cohort (channel-restricted\
        \ objects are reported as not for sale; no holder identities or ops fields).\
        \ Coalesced per API process (single-flight + micro-cache validated by the\
        \ inventory version, <= 1 s). Weak ETag = stateToken + epoch.sequence; If-None-Match\
        \ returns 304. `Cache-Control: public, max-age=1, s-maxage=2, stale-while-revalidate=5`\
        \ (PUBLIC_STATE_* env). Live changes continue on the authenticated SSE stream;\
        \ reserve/confirm remain authoritative. `eventId` also accepts the event key.\
        \ A deactivated workspace returns 403 `workspace_deactivated` (no-store).\
        \ CDN cache key: path + Origin + normalized Accept-Encoding. Never forward\
        \ or key on cookies, Authorization, x-api-key, x-channel-key or the query\
        \ string."
      operationId: getApiPublicByPublicKeyEventsByEventIdState
      parameters:
      - description: Workspace public key (`pub_…`).
        explode: false
        in: path
        name: publicKey
        required: true
        schema:
          maxLength: 64
          minLength: 1
          type: string
        style: simple
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      security: []
      summary: Public compact visual state (CDN-cacheable)
      tags:
      - public
  /api/public/chart-previews/{chartId}/manifest:
    get:
      description: "Validates a preview link and returns `{ chartId, name, mapRevision,\
        \ geometryHash, seatCount, gaCount, expiresAt, geometryUrl }`. 403 `preview_link_invalid`\
        \ (bad signature or revoked), 410 `preview_link_expired`, 404 unknown/unpublished/archived\
        \ chart. `Cache-Control: public, max-age=30`; `X-Robots-Tag: noindex`."
      operationId: getApiPublicChart-previewsByChartIdManifest
      parameters:
      - explode: false
        in: path
        name: chartId
        required: true
        schema:
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          type: string
        style: simple
      - description: Expiry (unix seconds) from the link.
        explode: true
        in: query
        name: exp
        required: true
        schema:
          pattern: "^[0-9]{1,12}$"
          type: string
        style: form
      - description: Signature from the link.
        explode: true
        in: query
        name: sig
        required: true
        schema:
          maxLength: 64
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security: []
      summary: Chart preview manifest (signed link)
      tags:
      - public
  /api/public/chart-previews/{chartId}/geometry/{hash}:
    get:
      description: "Content-addressed published geometry (sha256 of the canonical\
        \ JSON; clients verify it). Structural fields only — no prices, inventory\
        \ or event data. Cacheable while the link is valid (max one day)."
      operationId: getApiPublicChart-previewsByChartIdGeometryByHash
      parameters:
      - explode: false
        in: path
        name: chartId
        required: true
        schema:
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          type: string
        style: simple
      - explode: false
        in: path
        name: hash
        required: true
        schema:
          pattern: "^[a-f0-9]{64}$"
          type: string
        style: simple
      - description: Expiry (unix seconds) from the link.
        explode: true
        in: query
        name: exp
        required: true
        schema:
          pattern: "^[0-9]{1,12}$"
          type: string
        style: form
      - description: Signature from the link.
        explode: true
        in: query
        name: sig
        required: true
        schema:
          maxLength: 64
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security: []
      summary: Chart preview geometry (signed link)
      tags:
      - public
  /api/health:
    get:
      description: "Readiness probe with Redis, PostgreSQL and release schema checks\
        \ (503 when degraded)."
      operationId: getApiHealth
      responses:
        "200":
          description: HTTP 200
      summary: Health check
      tags:
      - health
  /api/auth/signup:
    post:
      description: "Registers a new user, provisions a tenant workspace, and returns\
        \ an HS256 dashboard JWT (`tenant_id`, `sub`, `email`, `role`)."
      operationId: postApiAuthSignup
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuthSignup_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuthSignup_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuthSignup_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Create account and workspace
      tags:
      - auth
  /api/auth/login:
    post:
      description: "Returns tokens, or a second step: `{ twoFactorRequired: true,\
        \ pendingToken }` when the account has two-factor authentication (finish with\
        \ `POST /auth/2fa/verify`), or `{ twoFactorEnrollmentRequired: true, pendingToken\
        \ }` when the workspace requires 2FA and the account has none yet (`POST /auth/2fa/enroll/start`\
        \ then `/enroll/confirm`). No session exists until the second step succeeds."
      operationId: postApiAuthLogin
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuthLogin_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuthLogin_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuthLogin_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Sign in with email and password
      tags:
      - auth
  /api/auth/accept-invite:
    post:
      description: Creates a user in the invited tenant with the invited role and
        returns dashboard session tokens.
      operationId: postApiAuthAccept-invite
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuthAccept_invite_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuthAccept_invite_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuthAccept_invite_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Accept a workspace invitation
      tags:
      - auth
  /api/auth/invite/{token}:
    get:
      operationId: getApiAuthInviteByToken
      parameters:
      - explode: false
        in: path
        name: token
        required: true
        schema:
          maxLength: 128
          minLength: 32
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      summary: Preview invitation metadata
      tags:
      - auth
  /api/auth/refresh:
    post:
      description: "Consumes a one-time refresh token (Redis), revokes it, and returns\
        \ a new refresh + access pair. Use `audience: viewer` for B2C embed tokens."
      operationId: postApiAuthRefresh
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuthRefresh_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuthRefresh_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuthRefresh_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Rotate refresh token and issue new access JWT
      tags:
      - auth
  /api/auth/logout:
    post:
      operationId: postApiAuthLogout
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuthLogout_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuthLogout_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuthLogout_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Revoke refresh token
      tags:
      - auth
  /api/auth/switch-workspace:
    post:
      description: Re-issues dashboard JWT and refresh token for a workspace the user
        already belongs to. A workspace that requires two-factor authentication refuses
        members without it (403 `two_factor_enrollment_required`).
      operationId: postApiAuthSwitch-workspace
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuthSwitch_workspace_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuthSwitch_workspace_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuthSwitch_workspace_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Switch active workspace
      tags:
      - auth
  /api/auth/2fa/verify:
    post:
      description: Second step after `POST /auth/login` answered `twoFactorRequired`.
        Send the 6-digit TOTP `code` or a one-time `recoveryCode`. Returns the same
        tokens as a password-only sign-in. A pending sign-in lives 5 minutes and allows
        5 attempts; 10 failures lock second-factor checks for the account for 15 minutes
        (429 `too_many_attempts`). A code is accepted once (replay refused).
      operationId: postApiAuth2faVerify
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuth2faVerify_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuth2faVerify_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuth2faVerify_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Complete sign-in with a two-factor code
      tags:
      - auth
  /api/auth/2fa/enroll/start:
    post:
      description: "When `POST /auth/login` answered `twoFactorEnrollmentRequired`,\
        \ returns a new TOTP `secret` and its `otpauthUri` (render it as a QR code).\
        \ Calling again replaces the secret."
      operationId: postApiAuth2faEnrollStart
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnrollStart_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnrollStart_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnrollStart_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Start the enrolment required by the workspace (during sign-in)
      tags:
      - auth
  /api/auth/2fa/enroll/confirm:
    post:
      description: "Verifies the first code of the new secret, enables 2FA, and returns\
        \ the session tokens plus 10 one-time `recoveryCodes` (shown only now)."
      operationId: postApiAuth2faEnrollConfirm
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnrollConfirm_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnrollConfirm_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnrollConfirm_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      summary: Confirm the required enrolment and finish signing in
      tags:
      - auth
  /api/auth/me:
    get:
      description: Returns the authenticated user when the Bearer token was issued
        by `/auth/login` or `/auth/signup`.
      operationId: getApiAuthMe
      responses:
        "200":
          description: HTTP 200
      summary: Current dashboard user
      tags:
      - auth
  /api/auth/2fa:
    get:
      description: "`{ enabled, enabledAt, recoveryCodesRemaining, workspaceRequiresTwoFactor\
        \ }`."
      operationId: getApiAuth2fa
      responses:
        "200":
          description: HTTP 200
      security:
      - BearerAuth: []
      summary: Two-factor status of the signed-in user
      tags:
      - auth
  /api/auth/2fa/setup:
    post:
      description: Returns a new TOTP `secret` and `otpauthUri` (render as a QR code
        client-side). Confirm within 10 minutes with `POST /auth/2fa/enable`.
      operationId: postApiAuth2faSetup
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      security:
      - BearerAuth: []
      summary: Start two-factor enrolment
      tags:
      - auth
  /api/auth/2fa/enable:
    post:
      description: "Verifies a code of the pending secret, enables 2FA and returns\
        \ 10 one-time `recoveryCodes` (stored hashed; shown only now)."
      operationId: postApiAuth2faEnable
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnable_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnable_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiAuth2faEnable_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - BearerAuth: []
      summary: Confirm enrolment and enable two-factor authentication
      tags:
      - auth
  /api/auth/2fa/disable:
    post:
      description: Requires a current TOTP `code` or a `recoveryCode`. Refused (409)
        while the current workspace requires 2FA.
      operationId: postApiAuth2faDisable
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
