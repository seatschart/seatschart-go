  /api/events/actions/change-object-status:
    post:
      description: |-
        Applies several status changes — different events, statuses, hold tokens and orders — **all-or-nothing in one SQL transaction**. Either every change is applied or none is; there is never a partial result to reconcile.

        **Body**: `statusChanges[]` (1–100; at most 512 objects overall), each with exactly one of `eventId` / `eventKey`, `objects` (seat UUID or label; GA area id or name with `quantity`; optional per-object `ticketType` for bookings), `status` (or `type: RELEASE`) and the same optional fields as POST /events/{eventId}/actions/change-object-status: `orderId`, `holdToken` (book seats held by a buyer hold token), `keepExtraData`, `resalePriceCents`, `resaleListingId`, `allowedPreviousStatuses` / `rejectedPreviousStatuses`, `channelKeys` / `ignoreChannels`, `ticketBuyerId`. One **Idempotency-Key** covers the whole batch: a replay returns the stored response, a retry after a crash reuses the same booking orders.

        **Consistency**: row locks are taken in a deterministic order — booking orders by id, then every seat of every change by (eventId, seatId), then GA areas by (eventId, areaId) — so concurrent batches on overlapping seats serialize instead of deadlocking (a database-detected deadlock is retried transparently). Buyer holds are honoured exactly as for a single-event change: a seat held by a buyer (Redis hold lock, read under the seat row lock) is never booked unless its `holdToken` is supplied, hold sessions are frozen before the transaction, and GA places are first reserved in the same structure buyers hold from, so capacity can never be exceeded.

        **Not atomic, refused with 400 `not_atomic`**: administrative GA holds (`reservedByToken`) and GA releases by hold token (they live in Redis only). An object or hold token may appear in only one change (400 `duplicate_object` / `duplicate_hold_token`).

        **Responses**: 200 `{ results: [{ index, eventId, outcome: "applied", objects, gaAreas }] }` in request order. On any failure nothing is written and the status is that of the first failing change (400, 404, 409), with `{ error, message, failed, results: [{ index, eventId, outcome: "failed" | "rolled_back", status?, error?, message?, objects?, labels? }] }` — every invalid change is reported at once when the request itself is invalid; a conflict found under the row locks reports the change that hit it.
      operationId: postApiEventsActionsChange-object-status
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiEventsActionsChange_object_status_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiEventsActionsChange_object_status_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiEventsActionsChange_object_status_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Atomically change object statuses across events (all-or-nothing batch)
      tags:
      - object-status
  /api/events/{eventId}/object-statuses:
    get:
      description: Ops overlay (custom / resale / extraData). Distinct from Redis
        holds. See docs/SEATSIO_PARITY.md.
      operationId: getApiEventsByEventIdObject-statuses
