          result instead of sending again.
        explode: false
        in: header
        name: idempotency-key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      - description: Webhook UUID (stored lowercase)
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: deliveryId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Replay a webhook delivery
      tags:
      - webhooks
