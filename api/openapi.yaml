        \ `event.moved_to_chart_copy`, `event.season_status_changed`. Filter with\
        \ `types` (comma-separated), `from` (inclusive) / `to` (exclusive) ISO-8601\
        \ instants and `resourceId` (chart or event id). Pass `nextCursor` back as\
        \ `cursor` with the same filters until it is null; pages are stable while\
        \ new entries arrive. `data` carries the change details (never the actor e-mail).\
        \ The admin types `chart.created`, `event.for_sale_changed`, `event.channels_updated`,\
        \ `event.categories_updated` and `event.table_booking_changed` are also delivered\
        \ as webhooks whose items carry `log_id` = the entry `id`. API key, or a dashboard\
        \ member with the integrations permission (admin)."
      operationId: getApiEvent-log
      parameters:
      - description: "Page size (1..100, default 20)."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          description: "Page size (1..100, default 20)."
          maximum: 100
          minimum: 1
          type: number
        style: form
      - description: Opaque `nextCursor` value from the previous page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          maxLength: 512
          minLength: 1
          pattern: "^[A-Za-z0-9_-]+$"
          type: string
        style: form
      - description: "Comma-separated event log types (default: all)."
        explode: true
        in: query
        name: types
        required: false
        schema:
          maxLength: 1024
          minLength: 1
          type: string
        style: form
      - description: Inclusive lower bound (ISO-8601 instant).
        explode: true
        in: query
        name: from
        required: false
        schema:
          maxLength: 40
          minLength: 10
          type: string
        style: form
      - description: Exclusive upper bound (ISO-8601 instant).
        explode: true
        in: query
        name: to
        required: false
        schema:
          maxLength: 40
          minLength: 10
          type: string
        style: form
      - description: Only entries of this chart or event id.
        explode: true
        in: query
        name: resourceId
        required: false
        schema:
          maxLength: 128
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: "Event log: admin changes of charts and events (cursor-paginated)"
      tags:
      - event-log
