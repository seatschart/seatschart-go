      description: |-
        Promotes draft → `chart_seat_templates` + `chart_layouts`. Events clone templates on create.

        The draft is validated with the same rules the designer runs, at the **workspace severity** (`GET /api/workspace/chart-validation`; rules set to `off` are skipped). Error-level issues return `422 { error: "validation_failed", issues: [{ code, severity, objectIds, message, count, scope? }] }` (warnings included); warning-level issues do not block and are returned in `warnings`. Per-rule counts are stored with the version, so `GET /api/charts` (`validation`) and event creation (409 `chart_invalid`) never re-run the rules.

        Every successful publish appends an immutable version (`version`, `geometryHash`; `sameAsVersion` names an earlier version with identical content, e.g. after a restore). An optional JSON body `{ "note": "..." }` (≤ 280 chars) is stored on the version. See `GET /api/charts/:chartId/versions`. Emits the `chart.published` webhook. Use `POST /api/charts/:chartId/actions/validate` for a dry run.

        With `{ "autoPublish": true }` (designer auto-publish, off by default) the publish only runs while no event uses the chart; otherwise 409 `{ code: "ERR_AUTO_PUBLISH_CHART_HAS_EVENTS", params: { eventCount } }`.
      operationId: postApiChartsByChartIdMapPublish
      parameters:
      - explode: false
        in: path
        name: chartId
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
        style: simple
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiChartsByChartIdMapPublish_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiChartsByChartIdMapPublish_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiChartsByChartIdMapPublish_request'
        required: true
      responses:
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postApiChartsByChartIdMapPublish_422_response'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/postApiChartsByChartIdMapPublish_422_response'
            text/plain:
              schema:
                $ref: '#/components/schemas/postApiChartsByChartIdMapPublish_422_response'
          description: HTTP 422
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Publish chart map template
      tags:
      - charts
  /api/charts/{chartId}/map/draft/actions/discard:
    post:
      description: "Throws away unpublished draft changes; `GET .../map/draft` then\
        \ returns the published map again. The published map, versions and linked\
        \ events are untouched. `409 ERR_DRAFT_NOTHING_TO_DISCARD` when the draft\
        \ has no unpublished changes, `409 ERR_MAP_NEVER_PUBLISHED` when the chart\
        \ was never published (there is no version to reset to)."
      operationId: postApiChartsByChartIdMapDraftActionsDiscard
      parameters:
