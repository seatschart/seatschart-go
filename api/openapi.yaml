          pattern: "^\\d{4}-\\d{2}$"
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: "Monthly usage: used objects, charts and events"
      tags:
      - usage
