        \ `price` (catalog cents; null for GA), `categoryKey` (chart category id of\
        \ `category`; the value itself when no category defines it). `published` is\
        \ false when the chart has never been published (no rows). `?version=draft`\
        \ reports the unpublished designer draft instead (404 `draft_not_found` when\
        \ the chart has none): it reads only the draft row, never the published geometry\
        \ or its caches; `version` echoes the reported version. Buckets: `count` (places),\
        \ `objects`, `seats`, `gaPlaces`, `byCategory`, `bySection`, `byZone`, `byObjectType`;\
        \ `totals` sums every bucket. The `.csv` variant returns the same data as\
        \ RFC 4180 CSV (one line per object, or per group for summaries). Requires\
        \ content_write (or a partner API key with the reports scope)."
