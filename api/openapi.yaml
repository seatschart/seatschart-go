        \ (layoutMeta.seatZones) → their section's zone → the zone outline containing\
        \ them; GA areas use `zoneId` or their centre. Others → NO_ZONE. Optional\
        \ `?zone=` (zone name). The response lists the layout `zones`. Rows: `objectId`,\
        \ `label`, `objectType` (seat|ga), `status` (durable status or object status\
        \ overlay), `category`, `section`, `zone`, `forSale`, `channelKeyId`, `orderId`,\
        \ `availability` (available|not_available) and `availabilityReason` (available|resale|booked|held|custom_status|not_for_sale).\
        \ GA rows add `capacity`, `soldCount`, `heldCount`, `availableCount` and `places`\
        \ (places per reason). Availability: custom object status → custom_status;\
        \ sold → booked (resale overlay → resale, still available); durable or live\
        \ hold → held; not for sale → not_for_sale. `liveHolds` tells whether active\
        \ buyer holds were merged (false when skipped or Redis is unavailable). The\
        \ `.csv` variant returns the same data as RFC 4180 CSV (one line per object,\
        \ or per group for summaries). Requires content_write (or a partner API key\
        \ with the reports scope)."
