  /api/events/{eventId}/stream:
    get:
      description: "Protocol 5: compact bootstrap or exact checkpoint, absolute indexed\
        \ deltas and shared heartbeat. Geometry is immutable and separate. No periodic\
        \ snapshots on the wire. Periodic authority reconciliation repairs lost publications\
        \ and passive expiry. Transport cursor is independent of geometry identity\
        \ and verified projection digest. Gaps, dirty subscriptions, overflow and\
        \ incompatible revisions close with resync_required. Reconnect submits mapRevision,\
        \ stateToken, epoch and sequence; continuity must be proven or a compact snapshot\
        \ is returned. Visual state is bounded-stale; reserve/confirm remain authoritative."
      operationId: getApiEventsByEventIdStream
      parameters:
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
