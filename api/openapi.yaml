  /api/seats/best-available:
    post:
      description: "Returns seat IDs for the requested quantity, preferring adjacent\
        \ same-row groups near the map center. Filter the candidate pool by `category`\
        \ (or ordered `categories`, max 10: windows of the first category are tried\
        \ before the second, and so on), optional `sectionId` (layout section id or\
        \ name) and optional `zone` (layout zone id or name; seats resolve explicit\
        \ zone assignment, then their section zone, then the zone outline) before\
        \ ranking. `tryToPreventOrphanSeats` (default **true**) skips adjacent windows\
        \ that would leave a single empty seat at either end of the run, falling back\
        \ to them only when nothing else fits. `ticketTypes` (`{ ticketTypeId: count\
        \ }`) sets `quantity` to the sum, restricts the search to categories whose\
        \ ticket catalog offers every requested type, and returns `ticketTypes` (seatId\
        \ → ticketTypeId) ready to send as `seatTicketTypes` on confirm; events without\
        \ ticket types reject it. `accessibleSeats` (N) only returns windows containing\
        \ at least N seats flagged `accessibility.wheelchair` in the published seat\
        \ structure (409 when no such window exists). `channel` is salesChannel order\
        \ limits only. Pass **`x-channel-key`** for inventory partitions — do not\
        \ send the secret in the body. **`hold: false` (default):** suggest only —\
        \ does not lock. **`hold: true`:** ranks up to 32 candidate windows across\
        \ the category preferences, locks the first fit in one Lua call each (all-or-nothing\
        \ per window), then O(cart) PG gates (available/forSale/channel); on gate\
        \ failure releases only the locks it added. Requires **Idempotency-Key**,\
        \ and `userId` unless `holdToken` is given. `holdToken` appends the seats\
        \ to that existing hold session (same expiry bound; 409 `hold_token_conflict`\
        \ when the session is expired, foreign, confirming or full). `extraData` is\
        \ stored on the held seats (requires hold). Returns `hold_token` for confirm.\
        \ The organizer's booking limits (designer *Max seats per order*) cap `quantity`\
        \ and, with `holdToken`, the seats already on the token: best-available never\
        \ picks more than allowed (409 `booking_limit_exceeded` with `limit`, `current`,\
        \ `requested`). `sections` (max 20 section ids or names, XOR with `sectionId`)\
        \ ranks across the union of those sections. **API keys / dashboard sessions\
        \ only:** `channelKeys` (channel secret keys or ids) restricts the pool to\
        \ public seats plus those channels, `ignoreChannels: true` allows every channel\
        \ (both replace `x-channel-key`; buyers get 403). `orderId` (with `hold`)\
        \ is stored on the held seats as `extraData.orderId` and echoed in the response;\
        \ pass it as `externalOrderId` on confirm. **`status: \"booked\"`** (API keys\
        \ with the `bookings` scope, or dashboard sessions allowed to change object\
        \ statuses; buyers get 403) books the best window directly instead of holding\
        \ it: the same administrative booking as POST /events/{eventId}/actions/book\
        \ (one SQL transaction under the seat row locks; a seat held by a buyer is\
        \ never taken; when a ranked window was taken meanwhile the next one is tried).\
        \ Requires **Idempotency-Key**: the booking order id is derived from it, so\
        \ a retry returns the same booking. `ticketTypes` are recorded per seat, `extraData`\
        \ and `orderId` (as `extraData.orderId`) are stored on the booked seats. Response:\
        \ `status: \"booked\"`, `booked: true`, `bookingOrderId` (cancel with POST\
        \ /orders/{orderId}/cancel) and `objects` (status, extraData, orderId, ticketType\
        \ per seat). `status: \"reservedByToken\"` is the same as `hold: true`. **`keepExtraData:\
        \ true`** (hold or booked) keeps the seats' stored extraData and merges `extraData`\
        \ / `orderId` on top instead of replacing it."
      operationId: postApiSeatsBest-available
      parameters:
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiSeatsBest_available_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiSeatsBest_available_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiSeatsBest_available_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Suggest or atomically hold best available seats
      tags:
      - seats
  /api/ga/reserve:
    post:
      description: "Places a temporary hold on unnumbered GA capacity. **Idempotency-Key**\
        \ is required; repeats within ~24h return the cached hold response. Optional\
        \ `ticketBuyerId` is stored on the GA hold token and inherited by `POST /ga/confirm`.\
        \ The organizer's booking limits cap `quantity` (designer *Max GA tickets\
        \ per order*, else *Max seats per order*; strictest with the sales-channel\
        \ default): 409 `booking_limit_exceeded` (`limit`, `current`, `requested`,\
        \ `kind: \"ga\"`). GA tables sold as a whole (`shape.bookAs: \"whole\"`) take\
        \ every place in one hold: any other `quantity` answers 409 `ga_table_whole`\
        \ (`capacity`, `requested`)."
      operationId: postApiGaReserve
      parameters:
      - description: Required. Reuse with the same request on retry; a different payload
          conflicts. Seat confirmation binds this key durably in PostgreSQL; hold
          mutations use bounded Redis receipts.
        explode: false
        in: header
        name: idempotency-key
        required: true
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiGaReserve_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiGaReserve_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiGaReserve_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Hold GA area capacity (Redis)
      tags:
      - seats
  /api/ga/confirm:
    post:
      description: "Server-to-server only (`x-api-key`): commits GA capacity after\
        \ payment. SeatsChart-catalog events require a durable quote and matching\
        \ externalPaymentId/paidAmountCents/paidCurrency; partner-priced events accept\
        \ the declared paidAmountCents without a quote and synced catalogs validate\
        \ it (409 `price_mismatch`). The final ticketTypeId is re-checked against\
        \ the event sales rules (409 `quota_exceeded`, `buyer_limit_exceeded`, `lot_sold_out`)\
        \ and the quantity against the organizer's booking limits (409 `booking_limit_exceeded`;\
        \ holds placed before the current limits were published stay confirmable).\
        \ Previously accepted legacy receipts remain retryable. Consumer JWTs are\
        \ rejected. Durably records Idempotency-Key and conditionally increments sold_count\
        \ before reconciling Redis holds. **Idempotency-Key** required. Optional `ticketBuyerId`\
        \ is stored on the GA receipt (inherited from the hold token when omitted).\
        \ Quote failures return 409 with `error: quote_required` (no quoteId) or `error:\
        \ quote_mismatch` (quote or payment attestation does not match)."
      operationId: postApiGaConfirm
      parameters:
      - description: Required. Reuse with the same request on retry; a different payload
          conflicts. Seat confirmation binds this key durably in PostgreSQL; hold
          mutations use bounded Redis receipts.
        explode: false
        in: header
        name: idempotency-key
        required: true
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiGaConfirm_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiGaConfirm_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiGaConfirm_request'
        required: true
      responses:
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postApiGaConfirm_409_response'
          description: "`quote_required`: no `quoteId` on a new confirmation — create\
            \ a quote with `POST /api/quotes` for the hold, charge exactly its `totalCents`/`currency`,\
            \ then confirm. `quote_mismatch`: the quote does not belong to this confirmation\
            \ (event, userId, holdToken, credential, inventory, ticket types) or `externalPaymentId`/`paidAmountCents`/`paidCurrency`\
            \ differ from it. `conflict`: any other conflict (changed payload for\
            \ the same identity, expired or consumed quote, lost hold)."
      security:
      - ApiKeyAuth: []
      summary: Confirm GA purchase (Postgres sold_count)
      tags:
      - seats
  /api/ga/release:
    post:
      description: Clears this user's Redis GA hold for an area. Optional `holdToken`
        is deleted when it matches tenant/event/user. **Idempotency-Key** required.
        Emits SSE `ga` and webhook `ga.released`.
      operationId: postApiGaRelease
      parameters:
      - description: Required. Reuse with the same request on retry; a different payload
          conflicts. Seat confirmation binds this key durably in PostgreSQL; hold
          mutations use bounded Redis receipts.
        explode: false
        in: header
        name: idempotency-key
        required: true
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiGaRelease_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiGaRelease_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiGaRelease_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Release a GA capacity hold
      tags:
      - seats
