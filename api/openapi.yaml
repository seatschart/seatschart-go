  /api/events/{eventId}/actions/override-season-status:
    post:
      description: |-
        Requires **Idempotency-Key**. The objects of the path event (a non-source season member) stop following the season status. Idempotent per object. Response `{ ok, eventId, seasonId, overridden, added, released, objects? }`.

        **No overbooking.** Every object keeps exactly one authority per event (its seat row and Redis key), so an override only changes which (event, object) pairs the season fan-outs touch: season booking (`seasonId` on reserve), season status changes (`seasonId` on change-object-status), season inventory sync and the season booking view skip overridden pairs. Overriding never changes the status: a seat booked for the season stays booked in the event. `release: true` frees the objects in this event only. Unsold objects go through the administrative transition engine (held seats and accepted orders are refused, 409 `inventory_conflict`). Sold objects are refused with 409 `season_booked` (`objects: [{ objectId, label, orderId, seasonTicket }]`) unless `allowBookedRelease: true` is sent explicitly; then only seats of a season (multi-event) order are given back for this event, under the seat row lock: the reservation and the order item of this event are cancelled (`season_status_override`), the seat becomes available and its Redis confirmed marker is cleared; the order stays confirmed for its other events (refunds are up to you). The event's own sales are never released here (409 `event_sale`: cancel the order). Nothing changes on any refusal. The season source event cannot override (409 `season_source_event`); events outside a season get 409 `not_season_member`.
      operationId: postApiEventsByEventIdActionsOverride-season-status
      parameters:
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
        style: simple
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdActionsOverride_season_status_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdActionsOverride_season_status_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiEventsByEventIdActionsOverride_season_status_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Override the season status of objects in an event (OVERRIDE_SEASON_STATUS)
      tags:
      - seasons
  /api/events/{eventId}/actions/use-season-status:
    post:
      description: "Requires **Idempotency-Key**. Removes the overrides of the listed\
        \ objects in one transaction (event override rows and seat rows of the event\
        \ and of the season source locked in id order). Allowed only when the event\
        \ and the season agree commercially for every object: both free, or both sold\
        \ in the same order; otherwise **409 `season_status_conflict`** with `objects:\
        \ [{ objectId, label, reason: held | event_sold | season_sold | retired |\
        \ missing }]` and nothing changes. Then the season source state of those objects\
        \ is copied (for sale when `forSalePropagated`, channel, custom statuses;\
        \ custom statuses the event set on its own are cleared). Objects that were\
        \ not overridden are listed in `notOverridden`. Response `{ ok, eventId, seasonId,\
        \ reverted, notOverridden, syncSummary }`."
