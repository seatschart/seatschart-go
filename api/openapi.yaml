  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: "HS256 JWT; optional `tenant_id` claim (falls back to DEFAULT_TENANT_ID).\
        \ SSE clients must send `Authorization: Bearer` (fetch-based); query-string\
        \ tokens are rejected."
      scheme: bearer
      type: http
    ApiKeyAuth:
      description: Partner secret (`sk_live_…`) looked up via SHA-256 in Postgres
