  /api/seats/reserve:
    post:
      description: "JSON body: `eventId`, `seatIds` (1–64 UUIDs, unique), `userId`,\
        \ optional `holdToken` capability to append seats to an existing session.\
        \ `userId` is customer metadata, never ownership proof. Renew/append share\
        \ a two-hour maximum session lifetime. Optional `ticketBuyerId` (opaque partner\
        \ buyer id) is stored on a new hold token and inherited by its confirmation.\
        \ `eventId` also accepts the event key. Headers: **x-api-key** (B2B) *or*\
        \ **Authorization: Bearer** (HS256 JWT); optional **x-tenant-id**; **`Idempotency-Key`\
        \ is required** (1–255 chars after trim; use a fresh UUID v4 per checkout\
        \ attempt). Repeats with the same key within ~24h return the cached HTTP status\
        \ and JSON without re-running the Lua lock. Applies Redis TTL locks (**default\
        \ 600 s**, overridden by **`SEAT_HOLD_TTL_SEC`**, or by the workspace **hold\
        \ period** setting — `PATCH /workspace/settings`) with SSE `seat` → **`locked`**;\
        \ Postgres remains **`available`** until **`POST /api/seats/confirm`** persists\
        \ **`sold`** via the reservation worker. A hold token holds at most the workspace\
        \ `maxSeatsPerHoldToken` seats (409 `seat_limit`). **Booking limits:** the\
        \ organizer's *Max seats per order* (designer → Booking limits, stored as\
        \ `layoutMeta.bookingRules` of the published chart/event layout) caps the\
        \ seats one hold token holds, appends included, checked in the same atomic\
        \ call as the locks (parallel appends cannot exceed it); the strictest of\
        \ the sales-channel default, this limit, the per-buyer limit and `maxSeatsPerHoldToken`\
        \ wins. Refused with 409 `booking_limit_exceeded` (`limit`, `current` seats\
        \ already on the token, `requested`, `kind: \"seats\"`). Holds placed before\
        \ a lower limit was published keep their seats and stay confirmable; they\
        \ only cannot grow. With ticket buyer validation on, buyer tokens must carry\
        \ a bound ticket buyer id (403 `ticket_buyer_required` / `ticket_buyer_mismatch`)."
      operationId: postApiSeatsReserve
      parameters:
      - description: Partner B2B API key (alternative to Bearer).
        explode: false
        in: header
        name: x-api-key
        required: false
        schema:
          type: string
        style: simple
      - description: Bearer + HS256 JWT for B2C clients.
        explode: false
        in: header
        name: Authorization
        required: false
        schema:
          type: string
        style: simple
      - description: Tenant id for partner integrations.
        explode: false
        in: header
        name: x-tenant-id
        required: false
        schema:
          type: string
        style: simple
      - description: Required deduplication key (max 255 chars after trim; UUID v4
          recommended). 24h idempotent cache replay in Redis per tenant.
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiSeatsReserve_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiSeatsReserve_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiSeatsReserve_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Place a temporary Redis hold (Lua TTL) before payment
      tags:
      - seats
  /api/seats/confirm:
    post:
      description: "Server-to-server only (`x-api-key`). **Pricing source** (workspace\
        \ integration mode or event sales rules): `partner` events confirm the declared\
        \ `seatTicketTypes` and `seatPrices` (or `paidAmountCents`) without a quote;\
        \ `synced_catalog` events validate them against the pushed price table (409\
        \ `price_mismatch`, `price_table_missing`, `ticket_type_required`); `seatschart_catalog`\
        \ events require a durable catalog quote created before external payment.\
        \ Final ticket types are re-checked against the event quotas and buyer limit\
        \ (409 `quota_exceeded`, `buyer_limit_exceeded`, `lot_sold_out`). Configure\
        \ event currency before quoting. The organizer's booking limits are re-checked\
        \ (defence in depth; holds enforce them atomically): 409 `booking_limit_exceeded`\
        \ (`limit`, `requested`), except for holds placed before the current limits\
        \ were published. After verifying payment with your provider, send quoteId,\
        \ externalPaymentId, paidAmountCents, paidCurrency and the **`holdToken`**\
        \ capability returned via `POST /api/seats/reserve`. These payment fields\
        \ are the authenticated partner's attestation, not gateway verification by\
        \ SeatsChart. Retries of already accepted legacy decisions remain supported\
        \ without a quote. Consumer JWTs are rejected — confirmation must not run\
        \ from the browser. Validates Redis holds, then commits the order and requested\
        \ items in PostgreSQL before 202. Stream delivery is a best-effort trigger;\
        \ pending SQL items are reconciled by the worker. Provide externalOrderId\
        \ for stable partner identity. Legacy callers use a durable tenant-scoped\
        \ Idempotency-Key identity. Season/group holds require scope=hold and the\
        \ full source seatIds set; all frozen destinations form one atomic order.\
        \ GET /api/orders/:orderId reports the atomic cart outcome. HTTP keys are\
        \ durably bound to the authenticated credential and request; changed payload\
        \ returns 409. Optional `ticketBuyerId` (opaque partner buyer id) is stored\
        \ on the order, its reservations and object statuses; when omitted it is inherited\
        \ from the hold token. Quote failures return 409 with `error: quote_required`\
        \ (no quoteId) or `error: quote_mismatch` (quote or payment attestation does\
        \ not match)."
      operationId: postApiSeatsConfirm
      parameters:
      - description: Partner B2B API key (required for payment commit).
        explode: false
        in: header
        name: x-api-key
        required: true
        schema:
          type: string
        style: simple
      - description: Ignored for bootstrap env keys (bound to DEFAULT_TENANT_ID).
          Dashboard `sk_live_…` keys are tenant-scoped by hash.
        explode: false
        in: header
        name: x-tenant-id
        required: false
        schema:
          type: string
        style: simple
      - description: Required key (max 255 chars after trim); durable fallback identity
          when externalOrderId is omitted.
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiSeatsConfirm_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiSeatsConfirm_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiSeatsConfirm_request'
        required: true
      responses:
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postApiSeatsConfirm_409_response'
          description: "`quote_required`: no `quoteId` on a new confirmation — create\
            \ a quote with `POST /api/quotes` for the hold, charge exactly its `totalCents`/`currency`,\
            \ then confirm. `quote_mismatch`: the quote does not belong to this confirmation\
            \ (event, userId, holdToken, credential, inventory, ticket types) or `externalPaymentId`/`paidAmountCents`/`paidCurrency`\
            \ differ from it. `idempotency_conflict`: any other conflict (changed\
            \ payload for the same identity, expired or consumed quote, lost hold)."
      security:
      - ApiKeyAuth: []
      summary: Accept a durable confirmation intent before asynchronous seat materialization
      tags:
      - seats
  /api/seats/release:
    post:
      description: "Deletes KeyDB TTL seat locks when they are authorized by the **`holdToken`**\
        \ capability, rejects seats already sold in Postgres, publishes **`SSE` `available`**\
        \ only for locks actually removed. **`Idempotency-Key`** header is **required**;\
        \ repeats within ~24h return the cached response (no duplicate side effects).\
        \ Also: **`x-api-key`** or **`Authorization: Bearer`**."
      operationId: postApiSeatsRelease
      parameters:
      - description: Partner B2B API key (alternative to Bearer).
        explode: false
        in: header
        name: x-api-key
        required: false
        schema:
          type: string
        style: simple
      - description: Bearer + HS256 JWT for B2C clients.
        explode: false
        in: header
        name: Authorization
        required: false
        schema:
          type: string
        style: simple
      - description: Tenant id for partner integrations.
        explode: false
        in: header
        name: x-tenant-id
        required: false
        schema:
          type: string
        style: simple
      - description: Required deduplication key (max 255 chars after trim); 24h cache
          replay in Redis per tenant + route.
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postApiSeatsRelease_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiSeatsRelease_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiSeatsRelease_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Clear Redis TTL holds before expiry (checkout abandoned / declined)
      tags:
      - seats
  /api/orders/{orderId}:
    get:
      description: "Partner API key with the `bookings` scope, or a dashboard session\
        \ of a workspace member (any role); tenant-scoped. Returns the order status,\
