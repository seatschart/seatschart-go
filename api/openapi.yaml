      description: "Peak requests per minute and 429 counts per lane for the last\
        \ 10 minutes, hour, 24 hours or 7 days. The **sales lane** carries the buyer\
        \ path (seat map reads, manifest/geometry/state, the live stream, holds, renewals,\
        \ best-available, releases, quotes, confirmations); the **api lane** carries\
        \ everything else (reports, events, charts, workspaces, webhooks, keys), so\
