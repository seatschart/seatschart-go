    get:
      description: "Returns event metadata (key, name, date, chartId, currency, isInThePast,\
        \ createdAt, `seasons` containing the event `[{ id, name }]`, map publication\
        \ timestamps, per-event `categoryOverrides` and `tableBookingConfig` override,\
        \ event-only `categories` and `objectCategories`) and Postgres inventory counters\
        \ (`counts`). Counters reflect durable seat status only — live Redis holds\
        \ are not included; use GET /api/events/:eventId/seats for real-time visual\
        \ status. 404 when the event belongs to another tenant. `?expand=chartTableBooking`\
        \ adds `chartTableBooking`: the table booking mode of the layout the event\
        \ is drawn from (the published chart, or the event layout of a chart-less\
        \ event) without the per-event override."
      operationId: getApiEventsByEventId
      parameters:
      - description: Event id (UUID) or event key.
        explode: false
        in: path
        name: eventId
        required: true
        schema:
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          type: string
        style: simple
      - description: "Comma-separated. `chartTableBooking` adds the table booking\
          \ of the chart (`{ mode, tables? }` or null) — what `tableBookingConfig`\
          \ overrides. `zones` adds `zones[]` (same items as GET /events/{eventId}/zones)."
        explode: true
        in: query
        name: expand
        required: false
        schema:
          maxLength: 64
          pattern: "^[A-Za-z,]*$"
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Retrieve one event
      tags:
      - events
    patch:
      description: |-
        All fields optional. `date` is an ISO-8601 timestamp. `tableBookingConfig` overrides the chart table booking mode for this event only (`all_by_seat`, `all_by_table`, or `custom` with `tables: { tableId: by_seat | by_table }`); seat-to-table membership stays from the chart. `null` clears the override. Applied by reserve and in the published commercial layout. `categoryOverrides` **replaces** the per-event override map (keys = seat/GA `category` values; `null` clears all): `priceCents` sets the base price of every seat in the category (clearing it restores the chart price by seat label; ticket-type prices from the chart still take precedence), `tint` (#RRGGBB) recolors the category in this event's published geometry (republished atomically), `forSale: false` takes the category off sale (removing it puts it back on sale; retired seats stay off sale). `forSalePerCategory` (`{ category: boolean }`) toggles category availability without storing an override. Prices already accepted in orders never change. `key` sets, renames or clears (`null`) the event key (409 `event_key_taken`).

        **Chart switch** (`chartId`): moves the event to another published, non-archived chart of the workspace in **one transaction** with the event row and every seat/GA row locked in the commercial lock order. Seats are matched by `label`, GA areas by `name`: matched objects keep their ids (so holds, sales, orders and status history stay valid) and take the new geometry and category; sold/held/pending seats keep their price, other seats take the new chart price (or the category override). Unmatched objects without commercial state are removed, new chart objects are added (closed categories start not for sale), the event map draft is discarded and the geometry is republished atomically. Refused with **409 `chart_switch_conflict`** and nothing changed when a sold, held, pending or historical object has no counterpart, or a GA area would have less capacity than sold + held + withheld places: `objects: [{ objectId, label, objectType, reason: sold|held|pending|history|capacity, required?, capacity? }]`. Other refusals: 404 (chart), 409 `chart_not_published`, `chart_archived`, `season_chart_mismatch`. Emits `event.updated` with `changed_fields`.

        **Event categories** (seats.io event `categories` / `objectCategories`): `categories` **replaces** the event-only categories (`[{ key, label, color, accessible? }]`, max 128; keys and labels unique, and neither may reuse a chart category id or name: 400 `category_conflict`). They are added to this event's published layout categories (`{ id: key, name: label, tint, accessible }`), so the renderer, legend and filters show them. `objectCategories` **replaces** the object → category map (object label = seat label or GA area name; value = event category key, chart category id or chart category name; max 10000; unknown references: 400 `unknown_category` with `labels`). Assignments are resolved once, in this transaction: the objects' `category` becomes the category label (removing an assignment restores the previous category), reassigned seats take the price override of their new category (else the chart price) and close with a closed category, and the geometry is republished. Best available (`categories` filter), quotes, synced price tables (keyed by the label), sales rules, reports and the section aggregates of the renderer all see the event category. Events that use neither keep their geometry hash. Changes emit `event.categories_updated` (event log and admin webhook) and `event.updated` with `changed_fields` `categories` / `objectCategories`.

        Response: `{ id, key, name, date, currency, isInThePast, chartId, categoryOverrides, tableBookingConfig, categories, objectCategories, forSaleUpdated?, chartSwitch?: { previousChartId, chartId, keptSeats, addedSeats, removedSeats, keptGaAreas, addedGaAreas, removedGaAreas } }`.
      operationId: patchApiEventsByEventId
      parameters:
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          maxLength: 36
          minLength: 36
          type: string
        style: simple
      - description: Required on transactional routes. Reuse the same key for every
          retry of one logical operation; the API replays the stored outcome.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patchApiEventsByEventId_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/patchApiEventsByEventId_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/patchApiEventsByEventId_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: "Patch event: name, date, currency, overrides (isInThePast is irreversible)"
      tags:
      - events
