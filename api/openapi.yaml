  /api/seasons/{seasonId}/reports/by-status.csv:
    get:
      description: "Objects of the season grouped by status. Objects are matched by\
        \ label across the member events (same rule as season booking). Evaluated\
        \ events are the live (not past) members — all members when none is live.\
        \ Rows: `label`, `objectType`, `category`, `section`, `zone` (from the source\
        \ event), `status` (shared status or `mixed`), `availability` (available only\
        \ when free in every evaluated event), `availabilityReason` (the most definitive\
        \ blocking reason; a label missing from an event counts as not_for_sale),\
        \ `eventCount`, `availableIn`, `notAvailableEventIds`; GA rows add `capacity`\
        \ and `availableCount` (places free in every evaluated event). `events` lists\
        \ every member with `evaluated`. The `.csv` variant returns the same data\
        \ as RFC 4180 CSV (one line per object, or per group for summaries). At most\
        \ 100 member events. Requires content_write (or a partner API key with the\
        \ reports scope)."
      operationId: getApiSeasonsBySeasonIdReportsBy-status.csv
      parameters:
      - explode: false
        in: path
        name: seasonId
        required: true
        schema:
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          type: string
        style: simple
      - description: Only this status bucket.
        explode: true
        in: query
        name: status
        required: false
        schema:
          maxLength: 128
          minLength: 1
          type: string
        style: form
      - description: Merge active buyer holds from the per-event hold index (default
          `true`). `false` = Postgres only.
        explode: true
        in: query
        name: liveHolds
        required: false
        schema:
          enum:
          - "true"
          - "false"
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Season report by status (CSV)
      tags:
      - seasons
