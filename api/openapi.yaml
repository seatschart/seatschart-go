          application/json:
            schema:
              $ref: '#/components/schemas/postApiOrdersByOrderIdCancel_request'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/postApiOrdersByOrderIdCancel_request'
          text/plain:
            schema:
              $ref: '#/components/schemas/postApiOrdersByOrderIdCancel_request'
        required: true
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Cancel the entire order and preserve its history; does not refund payment
      tags:
      - orders
