  /api/webhooks/{id}/deliveries/{deliveryId}/replay:
    post:
      description: "Re-sends the identical request body and `X-SeatsChart-Event-Id`\
        \ of the original delivery, signed with the endpoint’s CURRENT secret (`x-seatschart-signature`),\
        \ so receivers can deduplicate by event id. One synchronous attempt; the result\
        \ is recorded as a new `replay` delivery and returned with `200` whether the\
        \ remote accepted it or not (inspect `delivery.status`). Works for paused\
        \ endpoints. Rate limited per workspace (`WEBHOOK_MANUAL_SEND_MAX` per `WEBHOOK_MANUAL_SEND_WINDOW_SEC`,\
        \ default 30/60 s): `429` with `Retry-After`."
      operationId: postApiWebhooksByIdDeliveriesByDeliveryIdReplay
      parameters:
