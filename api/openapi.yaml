    post:
      description: "Creates a new event scoped to the workspace. Optional `chartId`\
        \ clones the published chart seat/GA templates into event inventory. A chart\
        \ whose published map has error-level validation issues (workspace severity,\
        \ see `GET /api/workspace/chart-validation`) is refused with 409 `chart_invalid`\
        \ `{ chartId, issues: [{ code, severity, count, message }] }`; fix the chart\
        \ in the designer and publish again. Optional `key` (unique per workspace,\
        \ URL-safe, not UUID-shaped) can be used instead of the id in every event\
        \ route; 409 `event_key_taken`. Creation-time configuration is applied **in\
        \ the creation transaction** (all or nothing): `tableBookingConfig` and `categoryOverrides`\
        \ (same semantics as PATCH), `channels` (inventory channels with their objects\
        \ and GA `areaPlaces`; each `channelKey` secret is returned once) and `forSaleConfig`\
