  /api/events/{eventId}/reports/by-availability.json:
    get:
      description: "Buckets `available` and `not_available`; each row carries `availabilityReason`.\
        \ Optional `?availability=`. GA areas with at least one free place are `available`.\
        \ Rows: `objectId`, `label`, `objectType` (seat|ga), `status` (durable status\
        \ or object status overlay), `category`, `section`, `zone`, `forSale`, `channelKeyId`,\
        \ `orderId`, `availability` (available|not_available) and `availabilityReason`\
        \ (available|resale|booked|held|custom_status|not_for_sale). GA rows add `capacity`,\
        \ `soldCount`, `heldCount`, `availableCount` and `places` (places per reason).\
        \ Availability: custom object status → custom_status; sold → booked (resale\
        \ overlay → resale, still available); durable or live hold → held; not for\
        \ sale → not_for_sale. `liveHolds` tells whether active buyer holds were merged\
        \ (false when skipped or Redis is unavailable). The `.csv` variant returns\
        \ the same data as RFC 4180 CSV (one line per object, or per group for summaries).\
        \ Requires content_write (or a partner API key with the reports scope)."
      operationId: getApiEventsByEventIdReportsBy-availability.json
      parameters:
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          type: string
        style: simple
      - description: Only this availability bucket.
        explode: true
        in: query
        name: availability
        required: false
        schema:
          maxLength: 128
          minLength: 1
          type: string
        style: form
      - description: Merge active buyer holds from the per-event hold index (default
          `true`). `false` = Postgres only.
        explode: true
        in: query
        name: liveHolds
        required: false
        schema:
          enum:
          - "true"
          - "false"
          type: string
        style: form
      responses:
        "200":
          description: HTTP 200
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Detailed report grouped by availability (available / not_available)
      tags:
      - events
